<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="床の荷物を手でゆっくり持ち上げ、棚の上に置いた。基準面は床。">
  <!-- パターン HX1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HX1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HX1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HX1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="195" width="325" height="10" fill="url(#HX1-hatch)"/>
  <line class="dg-ref" x1="20" y1="195" x2="345" y2="195" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="20" y="211" text-anchor="start" font-size="12" fill="#333">基準面（床）</text>
  <rect class="dg-solid" x="220" y="96" width="120" height="8" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <line class="dg-line" x1="334" y1="104" x2="334" y2="195" stroke="#333" stroke-width="2"/>
  <text class="dg-note" x="334" y="90" text-anchor="end" font-size="12" fill="#555">棚</text>
  <rect class="dg-obj" x="92" y="171" width="32" height="24" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="108" y="164" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="108" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <path class="dg-path" d="M120,160 C150,90 200,70 250,80" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text class="dg-note" x="162" y="86" text-anchor="middle" font-size="12" fill="#555">手で持ち上げる</text>
  <rect class="dg-obj dg-after" x="260" y="72" width="32" height="24" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="276" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="208" y1="84" x2="208" y2="195" stroke="#777" stroke-width="1.2" marker-start="url(#HX1-dim)" marker-end="url(#HX1-dim)"/>
  <text class="dg-dimlbl" x="202" y="150" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="208" y1="84" x2="256" y2="84" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
