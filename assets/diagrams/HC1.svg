<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="糸につけた小球を最下点で水平に打ち出し、鉛直面内の円の最高点を通過。基準面は最下点。">
  <!-- パターン HC1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HC1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HC1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HC1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="40" y="170" width="290" height="10" fill="url(#HC1-hatch)"/>
  <line class="dg-ref" x1="40" y1="170" x2="330" y2="170" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="330" y="188" text-anchor="end" font-size="12" fill="#333">基準面（最下点）</text>
  <circle class="dg-path" cx="180" cy="100" r="70" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle class="dg-pivot" cx="180" cy="100" r="3" fill="#333"/>
  <line class="dg-string" x1="180" y1="100" x2="180" y2="170" stroke="#333" stroke-width="1.5"/>
  <line class="dg-string-after" x1="180" y1="100" x2="180" y2="30" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <circle class="dg-obj" cx="180" cy="170" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="168" y="190" text-anchor="end" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="166" y="158" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="192" y1="170" x2="236" y2="170" stroke="#e8590c" stroke-width="3" marker-end="url(#HC1-vel)"/>
  <text class="dg-vlbl" x="232" y="160" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <circle class="dg-obj dg-after" cx="180" cy="30" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="196" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="290" y1="30" x2="290" y2="170" stroke="#777" stroke-width="1.2" marker-start="url(#HC1-dim)" marker-end="url(#HC1-dim)"/>
  <text class="dg-dimlbl" x="298" y="104" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="190" y1="30" x2="290" y2="30" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
