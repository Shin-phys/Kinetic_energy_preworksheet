<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="振り子の支点の高さを基準面とする。糸を水平に張って静かに放し、最下点を通過。">
  <!-- パターン HPF のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HPF-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HPF-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HPF-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="150" y="40" width="60" height="10" fill="url(#HPF-hatch)"/>
  <line class="dg-ground" x1="150" y1="50" x2="210" y2="50" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="30" y="60" width="315" height="10" fill="url(#HPF-hatch)"/>
  <line class="dg-ref" x1="30" y1="60" x2="345" y2="60" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="30" y="54" text-anchor="start" font-size="12" fill="#333">基準面（支点の高さ）</text>
  <circle class="dg-pivot" cx="180" cy="60" r="3" fill="#333"/>
  <line class="dg-string" x1="180" y1="60" x2="290" y2="60" stroke="#333" stroke-width="1.5"/>
  <line class="dg-string-after" x1="180" y1="60" x2="180" y2="170" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <path class="dg-path" d="M290,72 A110,110 0 0 1 192,170" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle class="dg-obj" cx="290" cy="60" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="304" y="50" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="304" y="76" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <circle class="dg-obj dg-after" cx="180" cy="170" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="180" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="110" y1="60" x2="110" y2="170" stroke="#777" stroke-width="1.2" marker-start="url(#HPF-dim)" marker-end="url(#HPF-dim)"/>
  <text class="dg-dimlbl" x="104" y="120" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="110" y1="170" x2="170" y2="170" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
