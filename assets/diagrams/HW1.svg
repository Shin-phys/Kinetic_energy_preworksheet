<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="なめらかなおわん形の容器の内面。縁の近くから静かに放し、反対側で最も高い点へ。基準面は底。">
  <!-- パターン HW1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HW1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HW1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HW1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <path class="dg-solid" d="M47.6,100.4 A150,150 0 0 0 312.4,100.4 L312.4,200 L47.6,200 Z" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="40" y="171" width="280" height="10" fill="url(#HW1-hatch)"/>
  <line class="dg-ref" x1="40" y1="171" x2="320" y2="171" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="180" y="206" text-anchor="middle" font-size="12" fill="#333">基準面（底）</text>
  <text class="dg-note dg-surface" x="180" y="150" text-anchor="middle" font-size="12" fill="#555">なめらか</text>
  <path class="dg-path" d="M68.9,116.8 A141,141 0 0 0 288,120.6" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle class="dg-obj" cx="68.9" cy="116.8" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="82.9" y="104.8" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="82.9" y="124.8" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <circle class="dg-obj dg-after" cx="288" cy="120.6" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="274" y="114.6" text-anchor="end" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="28" y1="116.8" x2="28" y2="171" stroke="#777" stroke-width="1.2" marker-start="url(#HW1-dim)" marker-end="url(#HW1-dim)"/>
  <text class="dg-dimlbl" x="34" y="150" text-anchor="start" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="28" y1="116.8" x2="58.900000000000006" y2="116.8" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <line class="dg-dim" x1="332" y1="120.6" x2="332" y2="171" stroke="#777" stroke-width="1.2" marker-start="url(#HW1-dim)" marker-end="url(#HW1-dim)"/>
  <text class="dg-dimlbl" x="326" y="150" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="298" y1="120.6" x2="332" y2="120.6" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
