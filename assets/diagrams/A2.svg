<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="初速をもって投げ下ろし、地面に達する直前。基準面は地面。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン A2 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="A2-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="A2-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="A2-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="40" y="180" width="290" height="10" fill="url(#A2-hatch)"/>
  <line class="dg-ref" x1="40" y1="180" x2="330" y2="180" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="330" y="174" text-anchor="end" font-size="12" fill="#333">基準面</text>
  <line class="dg-dim" x1="100" y1="40" x2="100" y2="180" stroke="#777" stroke-width="1.2" marker-start="url(#A2-dim)" marker-end="url(#A2-dim)"/>
  <text class="dg-dimlbl" x="93" y="115" text-anchor="end" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="100" y1="40" x2="170" y2="40" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <path class="dg-path" d="M180,52 L180,162" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect class="dg-obj" x="172" y="32" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="180" y="24" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="160" y="45" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="208" y1="30" x2="208" y2="66" stroke="#e8590c" stroke-width="3" marker-end="url(#A2-vel)"/>
  <text class="dg-vlbl" x="218" y="54" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <rect class="dg-obj dg-after" x="172" y="164" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="160" y="170" text-anchor="end" font-size="13" font-weight="700" fill="#333">あと</text>
</svg>
