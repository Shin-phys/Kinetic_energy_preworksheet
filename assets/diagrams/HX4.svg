<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="なめらかな面から、途中のあらい面の区間を通過し、なめらかな斜面を上って最も高い点まで。基準面は水平面。">
  <!-- パターン HX4 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HX4-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HX4-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HX4-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <polygon class="dg-solid" points="220,180 330,80 330,180" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <rect class="dg-hatch" x="20" y="180" width="200" height="10" fill="url(#HX4-hatch)"/>
  <line class="dg-ref" x1="20" y1="180" x2="220" y2="180" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="20" y="200" text-anchor="start" font-size="12" fill="#333">基準面（水平面）</text>
  <polyline class="dg-rough" points="80,180 85,176 90,180 95,176 100,180 105,176 110,180 115,176 120,180 125,176 130,180 135,176 140,180 145,176 150,180 155,176 160,180 165,176 170,180" fill="none" stroke="#333" stroke-width="1.5"/>
  <text class="dg-note dg-surface" x="125" y="170" text-anchor="middle" font-size="12" fill="#555">あらい面</text>
  <text class="dg-note dg-surface" x="296" y="166" text-anchor="middle" font-size="12" fill="#555">なめらか</text>
  <rect class="dg-obj" x="32" y="164" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="40" y="136" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="40" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="26" y1="152" x2="60" y2="152" stroke="#e8590c" stroke-width="3" marker-end="url(#HX4-vel)"/>
  <text class="dg-vlbl" x="66" y="156" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <rect class="dg-obj dg-after" x="274.1" y="103.3" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2" transform="rotate(-42.3 282.1 111.3)"/>
  <text class="dg-tag dg-tag-end" x="266.1" y="101.3" text-anchor="end" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="342" y1="111.3" x2="342" y2="180" stroke="#777" stroke-width="1.2" marker-start="url(#HX4-dim)" marker-end="url(#HX4-dim)"/>
  <text class="dg-dimlbl" x="336" y="104" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="292.1" y1="111.3" x2="342" y2="111.3" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
