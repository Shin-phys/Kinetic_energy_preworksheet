<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="床に立てたばねの真上から静かに落とし、ばねを縮めながら下降の途中。基準面は床。">
  <!-- パターン HV1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HV1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HV1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HV1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="30" y="195" width="300" height="10" fill="url(#HV1-hatch)"/>
  <line class="dg-ref" x1="30" y1="195" x2="330" y2="195" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="330" y="212" text-anchor="end" font-size="12" fill="#333">基準面（床）</text>
  <line class="dg-natural" x1="60" y1="110" x2="320" y2="110" stroke="#333" stroke-width="1.5" stroke="#2f9e44" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="dg-note dg-natlbl" x="58" y="114" text-anchor="end" font-size="12" fill="#555">自然長</text>
  <text class="dg-tag dg-tag-start" x="90" y="24" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <text class="dg-tag dg-tag-end" x="200" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <polyline class="dg-spring" points="110,195 110,190 101,187.3 119,182 101,176.6 119,171.3 101,165.9 119,160.5 101,155.2 119,149.8 101,144.5 119,139.1 101,133.8 119,128.4 101,123 119,117.7 110,115 110,110" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <circle class="dg-obj" cx="110" cy="30" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="126" y="34" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <path class="dg-path" d="M110,42 L110,98" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="dg-dim" x1="80" y1="30" x2="80" y2="195" stroke="#777" stroke-width="1.2" marker-start="url(#HV1-dim)" marker-end="url(#HV1-dim)"/>
  <text class="dg-dimlbl" x="74" y="70" text-anchor="end" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="80" y1="30" x2="100" y2="30" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <polyline class="dg-spring" points="250,195 250,190 241,188.6 259,185.7 241,182.9 259,180 241,177.1 259,174.3 241,171.4 259,168.6 241,165.7 259,162.9 241,160 259,157.1 241,154.3 259,151.4 250,150 250,145" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <circle class="dg-obj dg-after" cx="250" cy="137" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <line class="dg-dim" x1="290" y1="110" x2="290" y2="145" stroke="#777" stroke-width="1.2" marker-start="url(#HV1-dim)" marker-end="url(#HV1-dim)"/>
  <text class="dg-dimlbl" x="298" y="132" text-anchor="start" font-size="14" font-style="italic" fill="#555">x</text>
  <line class="dg-dim" x1="215" y1="137" x2="215" y2="195" stroke="#777" stroke-width="1.2" marker-start="url(#HV1-dim)" marker-end="url(#HV1-dim)"/>
  <text class="dg-dimlbl" x="209" y="172" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="215" y1="137" x2="240" y2="137" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
