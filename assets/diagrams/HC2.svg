<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="鉛直面内のなめらかな半円形レールの内側を、最下点から初速をもってすべり上がり、最高点を通過。基準面は最下点。">
  <!-- パターン HC2 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HC2-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HC2-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HC2-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <path class="dg-line" d="M30,188 L200,188 A74,74 0 0 0 200,40 L150,40" fill="none" stroke="#333" stroke-width="2.5"/>
  <rect class="dg-hatch" x="30" y="180" width="315" height="10" fill="url(#HC2-hatch)"/>
  <line class="dg-ref" x1="30" y1="180" x2="345" y2="180" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="345" y="200" text-anchor="end" font-size="12" fill="#333">基準面（最下点）</text>
  <rect class="dg-obj" x="112" y="172" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="120" y="164" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="120" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="134" y1="168" x2="170" y2="168" stroke="#e8590c" stroke-width="3" marker-end="url(#HC2-vel)"/>
  <text class="dg-vlbl" x="176" y="172" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <text class="dg-note dg-surface" x="226" y="118" text-anchor="middle" font-size="12" fill="#555">なめらか</text>
  <path class="dg-path" d="M205,178 A64,64 0 0 0 205,50" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect class="dg-obj dg-after" x="190" y="40" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="182" y="34" text-anchor="end" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="320" y1="48" x2="320" y2="180" stroke="#777" stroke-width="1.2" marker-start="url(#HC2-dim)" marker-end="url(#HC2-dim)"/>
  <text class="dg-dimlbl" x="326" y="118" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="206" y1="48" x2="320" y2="48" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
