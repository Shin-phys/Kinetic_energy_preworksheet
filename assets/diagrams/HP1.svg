<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="地面を基準面とする。穴の底から真上に投げ上げ、地面より上の点へ。">
  <!-- パターン HP1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HP1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HP1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HP1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <polygon class="dg-solid" points="20,90 120,90 120,198 20,198" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <polygon class="dg-solid" points="245,90 340,90 340,198 245,198" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <line class="dg-ground" x1="120" y1="198" x2="245" y2="198" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="20" y="90" width="320" height="10" fill="url(#HP1-hatch)"/>
  <line class="dg-ref" x1="20" y1="90" x2="340" y2="90" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="20" y="84" text-anchor="start" font-size="12" fill="#333">基準面（地面）</text>
  <path class="dg-path" d="M180,172 L180,52" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle class="dg-obj" cx="180" cy="188" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="196" y="184" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="196" y="168" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="162" y1="184" x2="162" y2="150" stroke="#e8590c" stroke-width="3" marker-end="url(#HP1-vel)"/>
  <text class="dg-vlbl" x="156" y="164" text-anchor="end" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <circle class="dg-obj dg-after" cx="180" cy="40" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="200" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="140" y1="90" x2="140" y2="186" stroke="#777" stroke-width="1.2" marker-start="url(#HP1-dim)" marker-end="url(#HP1-dim)"/>
  <text class="dg-dimlbl" x="134" y="142" text-anchor="end" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="140" y1="186" x2="170" y2="186" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <line class="dg-dim" x1="272" y1="40" x2="272" y2="90" stroke="#777" stroke-width="1.2" marker-start="url(#HP1-dim)" marker-end="url(#HP1-dim)"/>
  <text class="dg-dimlbl" x="280" y="70" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="190" y1="40" x2="272" y2="40" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
