<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="なめらかな水平面。ばねを縮めて放し、自然長の手前を通過。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン B3 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="B3-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="B3-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="B3-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="30" y="40" width="10" height="50" fill="url(#B3-hatch)"/>
  <line class="dg-ground" x1="40" y1="40" x2="40" y2="90" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="40" y="90" width="300" height="10" fill="url(#B3-hatch)"/>
  <line class="dg-ground" x1="40" y1="90" x2="340" y2="90" stroke="#333" stroke-width="2"/>
  <text class="dg-tag dg-tag-start" x="48" y="36" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-hatch" x="30" y="140" width="10" height="50" fill="url(#B3-hatch)"/>
  <line class="dg-ground" x1="40" y1="140" x2="40" y2="190" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="40" y="190" width="300" height="10" fill="url(#B3-hatch)"/>
  <line class="dg-ground" x1="40" y1="190" x2="340" y2="190" stroke="#333" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="48" y="136" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-natural" x1="200" y1="30" x2="200" y2="200" stroke="#333" stroke-width="1.5" stroke="#2f9e44" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="dg-note dg-natlbl" x="200" y="22" text-anchor="middle" font-size="12" fill="#555">自然長</text>
  <polyline class="dg-spring" points="40,78 46,78 48.4,71 53.3,85 58.2,71 63.1,85 67.9,71 72.8,85 77.7,71 82.6,85 87.4,71 92.3,85 97.2,71 102.1,85 106.9,71 111.8,85 116.7,71 121.6,85 124,78 130,78" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <rect class="dg-obj" x="130" y="66" width="24" height="24" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="142" y="60" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <line class="dg-dim" x1="130" y1="110" x2="200" y2="110" stroke="#777" stroke-width="1.2" marker-start="url(#B3-dim)" marker-end="url(#B3-dim)"/>
  <text class="dg-dimlbl" x="165" y="124" text-anchor="middle" font-size="14" font-style="italic" fill="#555">x</text>
  <polyline class="dg-spring" points="40,178 46,178 49.4,171 56.1,185 62.9,171 69.6,185 76.4,171 83.1,185 89.9,171 96.6,185 103.4,171 110.1,185 116.9,171 123.6,185 130.4,171 137.1,185 143.9,171 150.6,185 154,178 160,178" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <rect class="dg-obj dg-after" x="160" y="166" width="24" height="24" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <line class="dg-dim" x1="160" y1="150" x2="200" y2="150" stroke="#777" stroke-width="1.2" marker-start="url(#B3-dim)" marker-end="url(#B3-dim)"/>
  <text class="dg-dimlbl" x="180" y="144" text-anchor="middle" font-size="14" font-style="italic" fill="#555">x′</text>
  <text class="dg-note" x="340" y="212" text-anchor="end" font-size="12" fill="#555">なめらかな水平面</text>
</svg>
