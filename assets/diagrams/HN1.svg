<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="振り子を静かに放すと、最下点で糸が釘に引っかかり、小さな円を描いて最も高い点へ。基準面は最下点。">
  <!-- パターン HN1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HN1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HN1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HN1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="120" y="14" width="60" height="10" fill="url(#HN1-hatch)"/>
  <line class="dg-ground" x1="120" y1="24" x2="180" y2="24" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="20" y="154" width="325" height="10" fill="url(#HN1-hatch)"/>
  <line class="dg-ref" x1="20" y1="154" x2="345" y2="154" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="345" y="172" text-anchor="end" font-size="12" fill="#333">基準面（最下点）</text>
  <circle class="dg-pivot" cx="150" cy="24" r="3" fill="#333"/>
  <circle class="dg-line dg-nail" cx="150" cy="100" r="3.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text class="dg-note" x="158" y="96" text-anchor="start" font-size="12" fill="#555">釘</text>
  <line class="dg-string" x1="150" y1="24" x2="56.2" y2="114" stroke="#333" stroke-width="1.5"/>
  <line class="dg-string-after" x1="150" y1="24" x2="150" y2="100" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <line class="dg-string-after" x1="150" y1="100" x2="202.2" y2="114" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <path class="dg-path" d="M56.2,114 A130,130 0 0 0 150,154 A54,54 0 0 0 202.2,114" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle class="dg-obj" cx="56.2" cy="114" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="54.2" y="138" text-anchor="end" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="68.2" y="138" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <circle class="dg-obj dg-after" cx="202.2" cy="114" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="216.2" y="106" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="12" y1="114" x2="12" y2="154" stroke="#777" stroke-width="1.2" marker-start="url(#HN1-dim)" marker-end="url(#HN1-dim)"/>
  <text class="dg-dimlbl" x="6" y="104" text-anchor="start" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="12" y1="114" x2="46.2" y2="114" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <line class="dg-dim" x1="300" y1="114" x2="300" y2="154" stroke="#777" stroke-width="1.2" marker-start="url(#HN1-dim)" marker-end="url(#HN1-dim)"/>
  <text class="dg-dimlbl" x="308" y="140" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="212.2" y1="114" x2="300" y2="114" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
