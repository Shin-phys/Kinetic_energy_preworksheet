<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="振り子を静かに放し、最下点を通過。基準面は最下点。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン A6 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="A6-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="A6-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="A6-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="130" y="14" width="100" height="10" fill="url(#A6-hatch)"/>
  <line class="dg-ground" x1="130" y1="24" x2="230" y2="24" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="50" y="154" width="270" height="10" fill="url(#A6-hatch)"/>
  <line class="dg-ref" x1="50" y1="154" x2="320" y2="154" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="50" y="186" text-anchor="start" font-size="12" fill="#333">基準面（最下点）</text>
  <line class="dg-string-after" x1="180" y1="24" x2="180" y2="154" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <line class="dg-string" x1="180" y1="24" x2="272" y2="116" stroke="#333" stroke-width="1.5"/>
  <path class="dg-path" d="M272,116 A130,130 0 0 1 180,154" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="dg-dim" x1="336" y1="116" x2="336" y2="154" stroke="#777" stroke-width="1.2" marker-start="url(#A6-dim)" marker-end="url(#A6-dim)"/>
  <text class="dg-dimlbl" x="344" y="140" text-anchor="start" font-size="14" font-style="italic" fill="#555">h₀</text>
  <line class="dg-guide" x1="282" y1="116" x2="336" y2="116" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <circle class="dg-obj" cx="272" cy="116" r="8" fill="#1c7ed6"/>
  <text class="dg-name" x="286" y="94" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="286" y="112" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <circle class="dg-obj dg-after" cx="180" cy="154" r="8" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="180" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#333">あと</text>
</svg>
