<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="鉛直ばねに自然長で物体をのせて静かに放し、最下点に達した。基準面は最下点。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン C1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="C1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="C1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="C1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="30" y="195" width="300" height="10" fill="url(#C1-hatch)"/>
  <line class="dg-ground" x1="30" y1="195" x2="330" y2="195" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="30" y="140" width="300" height="10" fill="url(#C1-hatch)"/>
  <line class="dg-ref" x1="30" y1="140" x2="330" y2="140" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="30" y="134" text-anchor="start" font-size="12" fill="#333">基準面</text>
  <line class="dg-natural" x1="60" y1="90" x2="300" y2="90" stroke="#333" stroke-width="1.5" stroke="#2f9e44" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="dg-note dg-natlbl" x="330" y="94" text-anchor="end" font-size="12" fill="#555">自然長</text>
  <text class="dg-tag dg-tag-start" x="60" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <text class="dg-tag dg-tag-end" x="200" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <polyline class="dg-spring" points="110,195 110,190 101,186.6 119,179.8 101,173 119,166.3 101,159.5 119,152.7 101,145.9 119,139.1 101,132.3 119,125.5 101,118.8 119,112 101,105.2 119,98.4 110,95 110,90" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <rect class="dg-obj" x="94" y="72" width="32" height="18" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="110" y="64" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <line class="dg-dim" x1="82" y1="90" x2="82" y2="140" stroke="#777" stroke-width="1.2" marker-start="url(#C1-dim)" marker-end="url(#C1-dim)"/>
  <text class="dg-dimlbl" x="75" y="120" text-anchor="end" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <polyline class="dg-spring" points="250,195 250,190 241,188.4 259,185.2 241,182 259,178.8 241,175.5 259,172.3 241,169.1 259,165.9 241,162.7 259,159.5 241,156.3 259,153 241,149.8 259,146.6 250,145 250,140" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <rect class="dg-obj dg-after" x="234" y="122" width="32" height="18" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <line class="dg-dim" x1="215" y1="90" x2="215" y2="140" stroke="#777" stroke-width="1.2" marker-start="url(#C1-dim)" marker-end="url(#C1-dim)"/>
  <text class="dg-dimlbl" x="208" y="120" text-anchor="end" font-size="14" font-style="italic" fill="#555">x</text>
</svg>
