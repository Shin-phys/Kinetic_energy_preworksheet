<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="基準面を途中の高さにとる。静止から落下し床に達する直前。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン A8 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="A8-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="A8-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="A8-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="190" width="320" height="10" fill="url(#A8-hatch)"/>
  <line class="dg-ground" x1="20" y1="190" x2="340" y2="190" stroke="#333" stroke-width="2"/>
  <rect class="dg-solid" x="30" y="110" width="80" height="80" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <rect class="dg-hatch" x="30" y="110" width="300" height="10" fill="url(#A8-hatch)"/>
  <line class="dg-ref" x1="30" y1="110" x2="330" y2="110" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="330" y="104" text-anchor="end" font-size="12" fill="#333">基準面</text>
  <line class="dg-dim" x1="150" y1="36" x2="150" y2="110" stroke="#777" stroke-width="1.2" marker-start="url(#A8-dim)" marker-end="url(#A8-dim)"/>
  <text class="dg-dimlbl" x="143" y="78" text-anchor="end" font-size="14" font-style="italic" fill="#555">h₀</text>
  <line class="dg-guide" x1="150" y1="36" x2="190" y2="36" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <line class="dg-dim" x1="150" y1="110" x2="150" y2="190" stroke="#777" stroke-width="1.2" marker-start="url(#A8-dim)" marker-end="url(#A8-dim)"/>
  <text class="dg-dimlbl" x="143" y="155" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <path class="dg-path" d="M200,48 L200,172" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect class="dg-obj" x="192" y="28" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="200" y="22" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="222" y="34" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-obj dg-after" x="192" y="174" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="222" y="186" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
</svg>
