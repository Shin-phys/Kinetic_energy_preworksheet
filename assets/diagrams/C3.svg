<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="鉛直ばねで打ち上げ、ばねを離れて上昇の途中を通過。基準面は放した位置。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン C3 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="C3-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="C3-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="C3-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="30" y="200" width="300" height="10" fill="url(#C3-hatch)"/>
  <line class="dg-ground" x1="30" y1="200" x2="330" y2="200" stroke="#333" stroke-width="2"/>
  <line class="dg-natural" x1="60" y1="110" x2="320" y2="110" stroke="#333" stroke-width="1.5" stroke="#2f9e44" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="dg-note dg-natlbl" x="58" y="114" text-anchor="end" font-size="12" fill="#555">自然長</text>
  <rect class="dg-hatch" x="30" y="150" width="300" height="10" fill="url(#C3-hatch)"/>
  <line class="dg-ref" x1="30" y1="150" x2="330" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="30" y="174" text-anchor="start" font-size="12" fill="#333">基準面</text>
  <text class="dg-tag dg-tag-start" x="60" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <text class="dg-tag dg-tag-end" x="190" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <polyline class="dg-spring" points="110,200 110,195 101,193.6 119,190.7 101,187.9 119,185 101,182.1 119,179.3 101,176.4 119,173.6 101,170.7 119,167.9 101,165 119,162.1 101,159.3 119,156.4 110,155 110,150" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <circle class="dg-obj" cx="110" cy="141" r="9" fill="#1c7ed6"/>
  <text class="dg-name" x="126" y="130" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <line class="dg-dim" x1="80" y1="110" x2="80" y2="150" stroke="#777" stroke-width="1.2" marker-start="url(#C3-dim)" marker-end="url(#C3-dim)"/>
  <text class="dg-dimlbl" x="73" y="135" text-anchor="end" font-size="14" font-style="italic" fill="#555">x₀</text>
  <polyline class="dg-spring" points="250,200 250,195 241,192.1 259,186.4 241,180.7 259,175 241,169.3 259,163.6 241,157.9 259,152.1 241,146.4 259,140.7 241,135 259,129.3 241,123.6 259,117.9 250,115 250,110" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <path class="dg-path" d="M250,104 L250,94" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle class="dg-obj dg-after" cx="250" cy="80" r="9" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <line class="dg-dim" x1="304" y1="89" x2="304" y2="150" stroke="#777" stroke-width="1.2" marker-start="url(#C3-dim)" marker-end="url(#C3-dim)"/>
  <text class="dg-dimlbl" x="312" y="128" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="262" y1="89" x2="304" y2="89" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
