<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="斜め上に投げ、最高点に達した。基準面は投げた点。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン A5 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="A5-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="A5-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="A5-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="175" width="320" height="10" fill="url(#A5-hatch)"/>
  <line class="dg-ref" x1="20" y1="175" x2="340" y2="175" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="340" y="168" text-anchor="end" font-size="12" fill="#333">基準面（投げた点）</text>
  <path class="dg-path" d="M60,167 Q180,-67 300,167" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="dg-dim" x1="180" y1="60" x2="180" y2="175" stroke="#777" stroke-width="1.2" marker-start="url(#A5-dim)" marker-end="url(#A5-dim)"/>
  <text class="dg-dimlbl" x="188" y="125" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <rect class="dg-obj" x="52" y="159" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="60" y="202" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="46" y="160" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="68" y1="158" x2="98" y2="122" stroke="#e8590c" stroke-width="3" marker-end="url(#A5-vel)"/>
  <text class="dg-vlbl" x="104" y="134" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v₀</text>
  <rect class="dg-obj dg-after" x="172" y="42" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="164" y="55" text-anchor="end" font-size="13" font-weight="700" fill="#333">あと</text>
</svg>
