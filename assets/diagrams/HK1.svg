<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="崖の途中の展望台の高さを基準面とする。崖の上から水平に投げ、海面に達する直前。">
  <!-- パターン HK1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HK1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HK1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HK1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <polygon class="dg-solid" points="20,40 120,40 120,110 100,110 100,198 20,198" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <line class="dg-line" x1="120" y1="110" x2="150" y2="110" stroke="#333" stroke-width="3"/>
  <text class="dg-note" x="152" y="124" text-anchor="start" font-size="12" fill="#555">展望台</text>
  <rect class="dg-hatch" x="20" y="110" width="325" height="10" fill="url(#HK1-hatch)"/>
  <line class="dg-ref" x1="20" y1="110" x2="345" y2="110" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="345" y="104" text-anchor="end" font-size="12" fill="#333">基準面</text>
  <path class="dg-line" d="M100,198 q12,-5 24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#1c7ed6" stroke-opacity="0.6" stroke-width="1.5"/>
  <text class="dg-note" x="340" y="214" text-anchor="end" font-size="12" fill="#555">海面</text>
  <rect class="dg-obj" x="104" y="24" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="112" y="18" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="78" y="30" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="124" y1="32" x2="162" y2="32" stroke="#e8590c" stroke-width="3" marker-end="url(#HK1-vel)"/>
  <text class="dg-vlbl" x="168" y="36" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <path class="dg-path" d="M120,33 Q230,40 262,182" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect class="dg-obj dg-after" x="256" y="182" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="284" y="188" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="200" y1="32" x2="200" y2="110" stroke="#777" stroke-width="1.2" marker-start="url(#HK1-dim)" marker-end="url(#HK1-dim)"/>
  <text class="dg-dimlbl" x="208" y="76" text-anchor="start" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="120" y1="32" x2="200" y2="32" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <line class="dg-dim" x1="310" y1="110" x2="310" y2="190" stroke="#777" stroke-width="1.2" marker-start="url(#HK1-dim)" marker-end="url(#HK1-dim)"/>
  <text class="dg-dimlbl" x="318" y="156" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="272" y1="190" x2="310" y2="190" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
