<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="なめらかな斜面を静かにすべり下り、下端に達した。基準面は下端。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン A7 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="A7-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="A7-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="A7-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="175" width="325" height="10" fill="url(#A7-hatch)"/>
  <line class="dg-ref" x1="20" y1="175" x2="345" y2="175" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="44" y="202" text-anchor="start" font-size="12" fill="#333">基準面</text>
  <polygon class="dg-solid" points="40,60 40,175 270,175" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="2"/>
  <text transform="rotate(26.57 160 104)" class="dg-note dg-surface" x="160" y="104" text-anchor="middle" font-size="12" fill="#555">なめらか</text>
  <path class="dg-path" d="M232,160 Q270,168 290,167" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path class="dg-angle" d="M240,175 A30,30 0 0 1 243.2,161.6" fill="none" stroke="#555" stroke-width="1.2"/>
  <text class="dg-dimlbl" x="228" y="170" text-anchor="end" font-size="12" fill="#555">θ</text>
  <line class="dg-dim" x1="24" y1="60" x2="24" y2="175" stroke="#777" stroke-width="1.2" marker-start="url(#A7-dim)" marker-end="url(#A7-dim)"/>
  <text class="dg-dimlbl" x="30" y="128" text-anchor="start" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="24" y1="60" x2="40" y2="60" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <rect class="dg-obj" x="58" y="55" width="16" height="16" rx="2" fill="#1c7ed6" transform="rotate(26.57 66 63)"/>
  <text class="dg-name" x="66" y="44" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="92" y="38" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-obj dg-after" x="290" y="159" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="298" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#333">あと</text>
</svg>
