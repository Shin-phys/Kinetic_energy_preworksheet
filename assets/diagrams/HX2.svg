<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="パラシュートを開いて一定の速さで降下し、地面に達した。基準面は地面。">
  <!-- パターン HX2 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HX2-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HX2-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HX2-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="195" width="325" height="10" fill="url(#HX2-hatch)"/>
  <line class="dg-ref" x1="20" y1="195" x2="345" y2="195" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="345" y="211" text-anchor="end" font-size="12" fill="#333">基準面（地面）</text>
  <path class="dg-line" d="M140,44 A40,26 0 0 1 220,44 Z" fill="#e8590c" fill-opacity="0.15" stroke="#333" stroke-width="1.5"/>
  <line class="dg-line" x1="140" y1="44" x2="180" y2="72" stroke="#333" stroke-width="1.5" stroke-width="1"/>
  <line class="dg-line" x1="220" y1="44" x2="180" y2="72" stroke="#333" stroke-width="1.5" stroke-width="1"/>
  <rect class="dg-obj" x="172" y="72" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="200" y="84" text-anchor="start" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="236" y="40" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <path class="dg-path" d="M180,92 L180,176" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect class="dg-obj dg-after" x="172" y="179" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="200" y="190" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="110" y1="80" x2="110" y2="195" stroke="#777" stroke-width="1.2" marker-start="url(#HX2-dim)" marker-end="url(#HX2-dim)"/>
  <text class="dg-dimlbl" x="104" y="140" text-anchor="end" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="110" y1="80" x2="170" y2="80" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
