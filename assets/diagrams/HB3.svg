<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="床に立てたばねに取りつけ、縮めた位置で静かに放し、自然長を通過。基準面は自然長の位置。">
  <!-- パターン HB3 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HB3-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HB3-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HB3-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="30" y="205" width="300" height="10" fill="url(#HB3-hatch)"/>
  <line class="dg-ground" x1="30" y1="205" x2="330" y2="205" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="30" y="110" width="300" height="10" fill="url(#HB3-hatch)"/>
  <line class="dg-ref" x1="30" y1="110" x2="330" y2="110" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="330" y="104" text-anchor="end" font-size="12" fill="#333">基準面（自然長）</text>
  <text class="dg-tag dg-tag-start" x="60" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <text class="dg-tag dg-tag-end" x="180" y="24" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <polyline class="dg-spring" points="110,205 110,200 101,198.8 119,196.3 101,193.8 119,191.3 101,188.8 119,186.3 101,183.8 119,181.3 101,178.8 119,176.3 101,173.8 119,171.3 101,168.8 119,166.3 110,165 110,160" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <rect class="dg-obj" x="94" y="142" width="32" height="18" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="110" y="136" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <line class="dg-dim" x1="76" y1="110" x2="76" y2="160" stroke="#777" stroke-width="1.2" marker-start="url(#HB3-dim)" marker-end="url(#HB3-dim)"/>
  <text class="dg-dimlbl" x="70" y="140" text-anchor="end" font-size="14" font-style="italic" fill="#555">x<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-dim" x1="56" y1="110" x2="56" y2="160" stroke="#777" stroke-width="1.2" marker-start="url(#HB3-dim)" marker-end="url(#HB3-dim)"/>
  <text class="dg-dimlbl" x="50" y="140" text-anchor="end" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <polyline class="dg-spring" points="210,205 210,200 201,197 219,190.9 201,184.8 219,178.8 201,172.7 219,166.6 201,160.5 219,154.5 201,148.4 219,142.3 201,136.3 219,130.2 201,124.1 219,118 210,115 210,110" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  <rect class="dg-obj dg-after" x="194" y="92" width="32" height="18" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
</svg>
