<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="なめらかな斜面を静かにすべり下り、下端に固定したばねを縮める。基準面は斜面の下端（床）。">
  <!-- パターン HS1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HS1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HS1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HS1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="180" width="325" height="10" fill="url(#HS1-hatch)"/>
  <line class="dg-ground" x1="20" y1="180" x2="345" y2="180" stroke="#333" stroke-width="2"/>
  <polygon class="dg-solid" points="40,60 40,180 300,180" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <line class="dg-ground" x1="300" y1="180" x2="314.2" y2="149.1" stroke="#333" stroke-width="3"/>
  <text transform="rotate(24.8 127.6 85)" class="dg-note dg-surface" x="127.5831590895051" y="85.0038045885509" text-anchor="middle" font-size="12" fill="#555">なめらか</text>
  <rect class="dg-hatch" x="20" y="180" width="325" height="10" fill="url(#HS1-hatch)"/>
  <line class="dg-ref" x1="20" y1="180" x2="345" y2="180" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="345" y="196" text-anchor="end" font-size="12" fill="#333">基準面</text>
  <line class="dg-natural" x1="234.6" y1="149.8" x2="247.2" y2="122.6" stroke="#2f9e44" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="dg-note dg-natlbl" x="253.06548412428435" y="109.87759830473436" text-anchor="middle" font-size="12" fill="#555">自然長</text>
  <g transform="translate(40 60) rotate(24.8)">
  <polyline class="dg-spring" points="236.4,-9 242.4,-9 244.3,-15 248.1,-3 251.9,-15 255.7,-3 259.5,-15 263.3,-3 267.1,-15 270.9,-3 274.7,-15 278.5,-3 280.4,-9 286.4,-9" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <rect class="dg-obj" x="63" y="56.4" width="16" height="16" rx="2" fill="#1c7ed6" transform="rotate(24.8 71.01030513216926 64.40011086334835)"/>
  <text class="dg-name" x="71.01030513216926" y="48.400110863348345" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="93.01030513216926" y="50.400110863348345" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-obj dg-after" x="243.1" y="139.5" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2" transform="rotate(24.8 251.10987929612952 147.5229912467146)"/>
  <text class="dg-tag dg-tag-end" x="245.10987929612952" y="131.5229912467146" text-anchor="end" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="20" y1="64.40011086334835" x2="20" y2="180" stroke="#777" stroke-width="1.2" marker-start="url(#HS1-dim)" marker-end="url(#HS1-dim)"/>
  <text class="dg-dimlbl" x="26" y="140" text-anchor="start" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="20" y1="64.40011086334835" x2="61.010305132169265" y2="64.40011086334835" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <line class="dg-dim" x1="330" y1="147.5229912467146" x2="330" y2="180" stroke="#777" stroke-width="1.2" marker-start="url(#HS1-dim)" marker-end="url(#HS1-dim)"/>
  <text class="dg-dimlbl" x="324" y="172" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="261.1098792961295" y1="147.5229912467146" x2="330" y2="147.5229912467146" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
