<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="ブランコをこぎながら振れ幅を大きくし、最も高い点へ。基準面は最下点。">
  <!-- パターン HX3 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HX3-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HX3-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HX3-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="150" y="10" width="60" height="10" fill="url(#HX3-hatch)"/>
  <line class="dg-ground" x1="150" y1="20" x2="210" y2="20" stroke="#333" stroke-width="2"/>
  <rect class="dg-hatch" x="30" y="160" width="315" height="10" fill="url(#HX3-hatch)"/>
  <line class="dg-ref" x1="30" y1="160" x2="345" y2="160" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="30" y="178" text-anchor="start" font-size="12" fill="#333">基準面（最下点）</text>
  <circle class="dg-pivot" cx="180" cy="20" r="3" fill="#333"/>
  <line class="dg-string" x1="180" y1="20" x2="180" y2="160" stroke="#333" stroke-width="1.5"/>
  <path class="dg-path" d="M146.1,155.8 A140,140 0 0 0 213.9,155.8" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path class="dg-path" d="M114.3,143.6 A140,140 0 0 0 245.7,143.6" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path class="dg-path" d="M86.3,124.0 A140,140 0 0 0 273.7,124.0" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path class="dg-path" d="M86.3,124.0 A140,140 0 0 0 284.0,113.7" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="dg-string-after" x1="180" y1="20" x2="284" y2="113.7" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <rect class="dg-obj" x="172" y="152" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="180" y="186" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="166" y="150" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-obj dg-after" x="276" y="105.7" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="298" y="105.7" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="335" y1="113.7" x2="335" y2="160" stroke="#777" stroke-width="1.2" marker-start="url(#HX3-dim)" marker-end="url(#HX3-dim)"/>
  <text class="dg-dimlbl" x="329" y="140" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="294" y1="113.7" x2="335" y2="113.7" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
