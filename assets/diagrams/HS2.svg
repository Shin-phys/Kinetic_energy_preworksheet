<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="なめらかな斜面の下端に固定したばねを縮めて放し、自然長の手前を通過。基準面は放した位置。">
  <!-- パターン HS2 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HS2-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HS2-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HS2-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="180" width="325" height="10" fill="url(#HS2-hatch)"/>
  <line class="dg-ground" x1="20" y1="180" x2="345" y2="180" stroke="#333" stroke-width="2"/>
  <polygon class="dg-solid" points="40,60 40,180 300,180" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <line class="dg-ground" x1="300" y1="180" x2="314.2" y2="149.1" stroke="#333" stroke-width="3"/>
  <text transform="rotate(24.8 127.6 85)" class="dg-note dg-surface" x="127.5831590895051" y="85.0038045885509" text-anchor="middle" font-size="12" fill="#555">なめらか</text>
  <rect class="dg-hatch" x="20" y="150" width="325" height="10" fill="url(#HS2-hatch)"/>
  <line class="dg-ref" x1="20" y1="150" x2="345" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="24" y="144" text-anchor="start" font-size="12" fill="#333">基準面（放した位置）</text>
  <line class="dg-natural" x1="172.9" y1="121.3" x2="185.5" y2="94.1" stroke="#2f9e44" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="dg-note dg-natlbl" x="191.3242459782536" y="81.38164223733556" text-anchor="middle" font-size="12" fill="#555">自然長</text>
  <g transform="translate(40 60) rotate(24.8)">
  <polyline class="dg-spring" points="242.4,-9 248.4,-9 249.7,-14 252.4,-4 255,-14 257.7,-4 260.4,-14 263,-4 265.7,-14 268.4,-4 271,-14 273.7,-4 276.4,-14 279,-4 280.4,-9 286.4,-9" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <rect class="dg-obj" x="248.6" y="142" width="16" height="16" rx="2" fill="#1c7ed6" transform="rotate(24.8 256.5576356031322 150.0373403114851)"/>
  <text class="dg-name" x="265.3578573298289" y="130.97019323697563" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="272.90090452414034" y="114.6269243159675" text-anchor="middle" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-obj dg-after" x="188.6" y="114.4" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2" transform="rotate(24.8 196.6323162261024 122.37950059900979)"/>
  <text class="dg-tag dg-tag-end" x="205.4325379527991" y="103.31235352450031" text-anchor="middle" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="330" y1="122.37950059900979" x2="330" y2="150.0373403114851" stroke="#777" stroke-width="1.2" marker-start="url(#HS2-dim)" marker-end="url(#HS2-dim)"/>
  <text class="dg-dimlbl" x="324" y="141.20842045524745" text-anchor="end" font-size="14" font-style="italic" fill="#555">h</text>
  <line class="dg-guide" x1="206.6323162261024" y1="122.37950059900979" x2="330" y2="122.37950059900979" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
