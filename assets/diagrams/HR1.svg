<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="あらい台の上をすべってきて台の端から飛び出し、床に達する直前。基準面は床。">
  <!-- パターン HR1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="HR1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="HR1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="HR1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <polygon class="dg-solid" points="20,80 150,80 150,195 20,195" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="1.5"/>
  <polyline class="dg-rough" points="20,80 25,76 30,80 35,76 40,80 45,76 50,80 55,76 60,80 65,76 70,80 75,76 80,80 85,76 90,80 95,76 100,80 105,76 110,80 115,76 120,80 125,76 130,80 135,76 140,80 145,76 150,80" fill="none" stroke="#333" stroke-width="1.5"/>
  <text class="dg-note dg-surface" x="60" y="72" text-anchor="middle" font-size="12" fill="#555">あらい面</text>
  <rect class="dg-hatch" x="20" y="195" width="325" height="10" fill="url(#HR1-hatch)"/>
  <line class="dg-ref" x1="20" y1="195" x2="345" y2="195" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="345" y="211" text-anchor="end" font-size="12" fill="#333">基準面（床）</text>
  <rect class="dg-obj" x="134" y="64" width="16" height="16" rx="2" fill="#1c7ed6"/>
  <text class="dg-name" x="142" y="58" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="116" y="50" text-anchor="end" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <line class="dg-vel" x1="154" y1="64" x2="190" y2="64" stroke="#e8590c" stroke-width="3" marker-end="url(#HR1-vel)"/>
  <text class="dg-vlbl" x="196" y="68" text-anchor="start" font-size="14" font-style="italic" fill="#e8590c">v<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <path class="dg-path" d="M150,72 Q240,76 268,180" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect class="dg-obj dg-after" x="262" y="179" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="290" y="184" text-anchor="start" font-size="13" font-weight="700" fill="#333">あと</text>
  <line class="dg-dim" x1="172" y1="72" x2="172" y2="195" stroke="#777" stroke-width="1.2" marker-start="url(#HR1-dim)" marker-end="url(#HR1-dim)"/>
  <text class="dg-dimlbl" x="178" y="140" text-anchor="start" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="152" y1="72" x2="172" y2="72" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
