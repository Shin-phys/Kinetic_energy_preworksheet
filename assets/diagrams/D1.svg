<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" class="dg" role="img" aria-label="あらい斜面を静かにすべり下り、下端に達した。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- パターン D1 のテンプレート。{{obj}} は問題データの label に置き換わる。数値は入れない。 -->
  <defs>
    <pattern id="D1-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" class="dg-hatchline" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <marker id="D1-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-vel-head" fill="#e8590c"/>
    </marker>
    <marker id="D1-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" class="dg-dim-head" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="dg-hatch" x="20" y="175" width="325" height="10" fill="url(#D1-hatch)"/>
  <line class="dg-ref" x1="20" y1="175" x2="345" y2="175" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="dg-reflbl" x="44" y="202" text-anchor="start" font-size="12" fill="#333">基準面</text>
  <polygon class="dg-solid" points="40,60 40,175 270,175" fill="#adb5bd" fill-opacity="0.25" stroke="#333" stroke-width="2"/>
  <polyline class="dg-rough" points="40,60 44.5,67.9 53.5,66.8 58.1,74.6 67.1,73.5 71.6,81.4 80.6,80.3 85.1,88.1 94.1,87.1 98.6,94.9 107.6,93.8 112.2,101.7 121.2,100.6 125.7,108.4 134.7,107.4 139.2,115.2 148.2,114.1 152.8,122 161.8,120.9 166.3,128.7 175.3,127.6 179.8,135.5 188.8,134.4 193.4,142.3 202.4,141.2 206.9,149 215.9,147.9 220.4,155.8 229.4,154.7 233.9,162.6 242.9,161.5 247.5,169.3 256.5,168.2 261,176.1 270,175" fill="none" stroke="#333" stroke-width="1.5"/>
  <text transform="rotate(26.57 160 102)" class="dg-note dg-surface dg-rough-lbl" x="160" y="102" text-anchor="middle" font-size="12" fill="#555">あらい面</text>
  <path class="dg-path" d="M232,160 Q270,168 290,167" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="dg-dim" x1="24" y1="60" x2="24" y2="175" stroke="#777" stroke-width="1.2" marker-start="url(#D1-dim)" marker-end="url(#D1-dim)"/>
  <text class="dg-dimlbl" x="30" y="128" text-anchor="start" font-size="14" font-style="italic" fill="#555">h<tspan class="dg-subscript" dy="4" font-size="10">0</tspan></text>
  <line class="dg-guide" x1="24" y1="60" x2="40" y2="60" stroke="#aaa" stroke-width="1" stroke-dasharray="2 3"/>
  <rect class="dg-obj" x="58" y="55" width="16" height="16" rx="2" fill="#1c7ed6" transform="rotate(26.57 66 63)"/>
  <text class="dg-name" x="66" y="44" text-anchor="middle" font-size="12" fill="#555">{{obj}}</text>
  <text class="dg-tag dg-tag-start" x="92" y="38" text-anchor="start" font-size="13" font-weight="700" fill="#333">はじめ</text>
  <rect class="dg-obj dg-after" x="290" y="159" width="16" height="16" rx="2" fill="#1c7ed6" fill-opacity="0.2" stroke="#1c7ed6" stroke-width="2"/>
  <text class="dg-tag dg-tag-end" x="298" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#333">あと</text>
</svg>
